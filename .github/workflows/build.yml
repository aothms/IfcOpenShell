name: Build IfcOpenShell

on:
  push:
    branches:
      - v0.8.0
  pull_request:
    branches:
      - v0.8.0
  workflow_dispatch:

jobs:
  build_ifcopenshell:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-20.04
            arch: x64
          - os: macos
            runner: macos-13
            arch: x64
          - os: macos
            runner: macos-14
            arch: arm64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Checkout Build Repository
        uses: actions/checkout@v3
        with:
          repository: aothms/build-outputs
          path: ./build
          ref: ${{ matrix.os }}-${{ matrix.arch }}
          lfs: true
          token: ${{ secrets.BUILD_REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git gcc g++ autoconf bison make cmake \
              mesa-common-dev libffi-dev libfontconfig1-dev libgl1-mesa-dev \
              libxext-dev libxmu-dev libxi-dev
        if: runner.os == 'linux'
        
      - name: Install Dependencies
        run: |
          brew update
          brew install git bison autoconf automake libffi cmake findutils
          echo "$(brew --prefix findutils)/libexec/gnubin" >> $GITHUB_PATH
        if: runner.os == 'macos'
        
      - name: Unpack Dependencies
        run: |
          find ./build -type f -name '*.tar.gz' -exec tar -xzf {} -C $(dirname {}) \;

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${GITHUB_WORKFLOW}-${{ matrix.os }}

      - name: Run Build Script
        run: |
          if [ "${{ matrix.os }}" == "macos" ]; then
            DARWIN_C_SOURCE=-D_DARWIN_C_SOURCE
          fi
          CXXFLAGS="-O3" CFLAGS="-O3 ${DARWIN_C_SOURCE}" ADD_COMMIT_SHA=1 BUILD_CFG=Release python3 ./nix/build-all.py --diskcleanup --py-310

      - name: Pack Dependencies
        run: |
          for install_dir in $(find $(find . -maxdepth 4 -name install) -mindepth 1 -maxdepth 1 -type d); do
            tar -czf "$install_dir.tar.gz" "$install_dir";
          done

      - name: Commit and Push Changes to Build Repository
        run: |
          cd build
          git config user.name "IfcOpenBot"
          git config user.email "ifcopenbot@ifcopenshell.org"
          git add "$(find . -maxdepth 4 -name install)/*.tar.gz"
          git commit -m "Update build artifacts [skip ci]" || echo "No changes to commit"
          git push

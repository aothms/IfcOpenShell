name: Build IfcOpenShell

on:
  push:
    branches:
      - v0.8.0
  pull_request:
    branches:
      - v0.8.0
  workflow_dispatch:

jobs:
  build_ifcopenshell:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Checkout Build Repository
        uses: actions/checkout@v3
        with:
          repository: aothms/build-outputs
          path: ./build
          ref: main # @todo branch equals platform
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git gcc g++ autoconf bison make cmake \
              mesa-common-dev libffi-dev libfontconfig1-dev libgl1-mesa-dev \
              libxext-dev libxmu-dev libxi-dev

      - name: Unpack Dependencies
        run: |
          find ./build -type f -name '*.tar.gz' -exec tar -xzf {} -C $(dirname {}) \;

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${GITHUB_WORKFLOW}

      - name: Run Build Script
        run: |
          BUILD_CFG=Release python3 ./nix/build-all.py --diskcleanup

      - name: Pack Dependencies
        run: |
          for install_dir in $(find $(find . -maxdepth 4 -name install) -mindepth 1 -maxdepth 1 -type d); do
            tar -czf "$install_dir.tar.gz" "$install_dir";
          done

      - name: Commit and Push Changes to Build Repository
        run: |
          cd build
          git config user.name "IfcOpenBot"
          git config user.email "ifcopenbot@ifcopenshell.org"
          git add "$(find . -maxdepth 4 -name install)/*.tar.gz"
          git commit -m "Update build artifacts [skip ci]" || echo "No changes to commit"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.BUILD_REPO_TOKEN }}
